    classe: "200034"
    itens: 466
    justificativa: "Queijos do codigo 0406 nao integram a cesta basica do Anexo I; sao alimentos do Anexo VII."
    referencia_legal: "LC 214/2025, Anexo VII (alimentos para consumo humano)"
    status: "divergente do mapa"

  - ncm: "07134000"
    familia: LENTILHA
    descricao: "Lentilha"
    classe_mapa: "200034"
    classe: "200003"
    itens: 168
    justificativa: "Leguminosas secas (lentilha) integram a cesta basica do Anexo I (reducao 100%), nao o Anexo VII."
    referencia_legal: "LC 214/2025, Anexo I (cesta basica nacional de alimentos)"
    status: "divergente do mapa"

  - ncm: "15121100"
    familia: OLEO_SOJA
    descricao: "Oleo de soja refinado"
    classe_mapa: "200034"
    classe: "200003"
    itens: 307
    justificativa: "Oleo de soja integra a cesta basica do Anexo I (reducao 100%), nao o Anexo VII."
